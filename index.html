*{box-sizing:border-box;margin:0;padding:0}

}

h1{

.gold-line{

.heading{

 letter-spacing:2px;

 margin-bottom:11px;
 text-align:left;
}

.contacts{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
}

.contact{
 min-width:0;
 display:flex;
 align-items:center;
 gap:10px;
 text-decoration:none;
 color:#f3eee4;
 background:linear-gradient(145deg,#1c1b18,#131312);

.contact:hover{
 border-color:#b89b60;
 transform:translateY(-2px);
 background:#211e17;
}

.contact.full{grid-column:1/-1}

.icon-box{
 width:34px;
 height:34px;
 min-width:34px;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#282319;
 color:#d9bb7c;

.icon-box svg{
 width:19px;
 height:19px;
 display:block;

.info{
 min-width:0;
 text-align:left;
}

.info small{
 display:block;
 font-size:9px;
 color:#a59b88;
 letter-spacing:1px;
 margin-bottom:4px;

.info strong{

.social-title{

.socials{

 gap:9px;

.social{

 gap:8px;
 padding:11px 5px;
 border-radius:11px;
 border:1px solid var(--border);
 background:#171613;
 color:#e3d4b4;
 text-decoration:none;
 font-size:10px;
 font-weight:600;

.social:hover{

.social svg{

 height:19px;
 fill:currentColor;

.actions{

 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:21px;

.action{
 border:1px solid #a4864b;
 border-radius:11px;
 padding:13px 8px;
 font-size:11px;
 font-weight:700;
 cursor:pointer;

.save{

.qr{

.action:hover{

.footer{

#qrArea{

@media(min-width:700px){

</style>

<script>

const profileURL =
"https://wakilahmadsaleh1999-source.github.io/";

function saveContact(){

const vcard = [
"BEGIN:VCARD",
"VERSION:3.0",
"FN:Wakil Ahmad Saleh",
"N:Saleh;Wakil Ahmad;;;",
"TEL;TYPE=CELL:+93797038044",
"TEL;TYPE=WHATSAPP:+93779765000",
"EMAIL:wakilahmadsaleh1999@gmail.com",
"URL:"+profileURL,
"NOTE:Telegram @w_a_saleh | Instagram @wa_saleh1",
"END:VCARD"
].join("\r\n");

const blob = new Blob([vcard],{
type:"text/vcard;charset=utf-8"
});

const url = URL.createObjectURL(blob);
const a = document.createElement("a");

a.href = url;
a.download = "Wakil-Ahmad-Saleh.vcf";
document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function downloadQR(){

if(typeof QRCode==="undefined"){
 alert("QR library could not load. Please check your internet connection.");
 return;
}

const area=document.getElementById("qrArea");
area.innerHTML="";

new QRCode(area,{
 text:profileURL,
 width:1200,
 height:1200,
 colorDark:"#080808",
 colorLight:"#ffffff",
 correctLevel:QRCode.CorrectLevel.H
});

setTimeout(()=>{

const canvas=area.querySelector("canvas");

if(!canvas){
 alert("QR generation failed. Please try again.");
 return;
}

const a=document.createElement("a");
a.download="Wakil-Ahmad-Saleh-QR.png";
a.href=canvas.toDataURL("image/png");
a.click();

},700);

}

</script>
