<script>
function downloadQR(){

const url = "https://wakilahmadsaleh1999-source.github.io/";

const qrBox = document.getElementById("qr");
qrBox.innerHTML = "";

new QRCode(qrBox,{
text:url,
width:1000,
height:1000,
colorDark:"#000000",
colorLight:"#ffffff",
correctLevel:QRCode.CorrectLevel.H
});

setTimeout(function(){

const canvas=qrBox.querySelector("canvas");

if(canvas){
const link=document.createElement("a");
link.download="Wakil-Ahmad-Saleh-QR.png";
link.href=canvas.toDataURL("image/png");
link.click();
}else{
alert("QR ساخته نشد. اتصال اینترنت را بررسی کنید.");
}

},500);

}
